name: keycloak
# The offline unit tests and the Keycloak scenario. The scenario starts its own Keycloak container with `docker run`
# (a service container cannot mount the realm file or pass `start-dev --import-realm`), bound to 127.0.0.1.
# The keycloak scenario also runs Claude Code against a mock gateway: it needs the `claude` CLI on PATH.
on:
  workflow_dispatch:
  pull_request:
    paths: ["client/**", "repro/**"]
jobs:
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Preflight
        run: python3 repro/run.py check
      - name: unit
        run: python3 repro/run.py unit
      - name: keycloak
        run: python3 repro/run.py keycloak
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: repro/results/
